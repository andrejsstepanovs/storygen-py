[project]
name = "storygen"
version = "0.1.0"
description = "Children Story Generator"
requires-python = ">=3.11"
dependencies = [
    "typer==0.26.7",
    "pydantic==2.13.4",
    "pydantic-settings==2.1.0",
    "langchain==1.3.8",
    "langchain-openai==1.3.0",
    "requests==2.34.2",
    "rich==15.0.0",
]

[project.scripts]
storygen = "storygen.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storygen"]
